<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f7f9">
  <title>Gemma Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Чат -->
  <section id="chat-view" class="chat-wrap">
    <div class="card chat">
      <header class="topbar">
        <div class="brand">
          <div class="logo logo-sm" aria-hidden="true">G</div>
          <div>
            <div class="title">Gemma 3 27B</div>
            <div class="muted small" id="meta"></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn-ghost" id="new-chat" title="Очистить чат">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            <span>Новый чат</span>
          </button>
          <button class="btn-ghost icon" id="theme-toggle" title="Переключить тему"></button>
        </div>
      </header>

      <main id="messages" class="messages">
        <div class="empty" id="empty">
          <div class="logo logo-lg" aria-hidden="true">G</div>
          <h2>Чем могу помочь?</h2>
          <p class="muted">Каждый запрос отправляется без истории переписки.<br>Длина ответа — до 1000 токенов.</p>
        </div>
      </main>

      <form id="chat-form" class="composer">
        <textarea id="input" rows="1" placeholder="Спросите что-нибудь…" required></textarea>
        <button type="submit" id="send" class="send" title="Отправить (Enter)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </form>
      <div class="hint muted">Enter — отправить · Shift+Enter — новая строка</div>
    </div>
  </section>

  <script src="env.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
